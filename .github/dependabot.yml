# Dependabot configuration for pi-extensions.
#
# Ecosystems
#   - npm: this package (single manifest at the repo root).
#   - github-actions: inert until a workflow exists under .github/workflows.
#
# Update behavior
#   - Weekly checks. Dependabot also applies a default 3-day release cooldown.
#   - package.json uses caret ranges so Dependabot has room to update:
#       * 0.x pi packages only auto-track within their minor (e.g. 0.84.x).
#         You bump to a new pi minor (0.85) on purpose.
#   - Safe updates are auto-merged by the dependabot-auto-merge workflow once
#     CI is green. Major version bumps arrive as PRs and are held by the same
#     workflow for manual review.
#
# Grouping
#   - Only the @earendil-works/* pi family is grouped into a single PR. Every
#     other dependency gets its own PR.
#
# Held for manual review (see .github/workflows/dependabot-auto-merge.yml)
#   - Any major version bump.
#   - @colbymchenry/codegraph. Its compat patch (scripts/patch-codegraph.mjs)
#     is hand-written against a specific version.
#   - @earendil-works/* (pi framework). It is 0.x, so a minor bump can break
#     the extension.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pi-packages:
        patterns:
          - "@earendil-works/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # PR-only. A major bump here is a major action version, which is
    # exactly what Dependabot is good at flagging, but a human merges it.
    auto-merge: false
