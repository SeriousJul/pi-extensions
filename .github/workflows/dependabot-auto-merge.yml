# Auto-merge the Dependabot updates that are safe to merge, once CI is green.
#
# Policy
#   - Only Dependabot PRs are acted on. The job is skipped for any other PR.
#   - A PR is auto-merged when it contains no major bump and no update to a
#     held family. Held families are reviewed by hand:
#       * @colbymchenry/codegraph - a hand-written compat patch
#         (scripts/patch-codegraph.mjs) is tied to a specific version.
#       * @earendil-works/* (pi framework) - it is 0.x, so a minor bump can
#         break the extension, and pi is the runtime the extension builds on.
#   - "Once CI is green" is enforced by GitHub native auto-merge plus the
#     branch protection on main (required checks: node 22/24/26, bun). This
#     workflow only *requests* the auto-merge. GitHub performs the squash merge
#     only after every required check passes. A red gate leaves the PR open.
#   - Runs on pull_request_target so it never executes code from the PR head.
#     It only reads PR metadata and calls the merge API.

name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot PR metadata
        uses: dependabot/fetch-metadata@v3
        id: metadata

      - name: Decide and request auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          DEPS_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail

          # fetch-metadata emits nothing it can parse for non-Dependabot PRs.
          if [ -z "${DEPS_JSON:-}" ] || [ "${DEPS_JSON:-}" = "null" ]; then
            echo "No dependency metadata. Holding for manual review."
            exit 0
          fi

          if [ "$(printf '%s' "${DEPS_JSON}" | jq 'if type == "array" then length else -1 end')" -lt 1 ]; then
            echo "No parsable updated dependencies. Holding for manual review."
            exit 0
          fi

          # Hold any PR that bumps a major version.
          if [ "$(printf '%s' "${DEPS_JSON}" | jq '[ .[] | select(.updateType | contains("semver-major")) ] | length')" -gt 0 ]; then
            echo "Contains a major version bump. Holding for manual review."
            exit 0
          fi

          # Hold the pi framework (0.x, a minor bump can break the extension).
          if [ "$(printf '%s' "${DEPS_JSON}" | jq '[ .[] | select(.dependencyName | startswith("@earendil-works/")) ] | length')" -gt 0 ]; then
            echo "Contains an @earendil-works/* (pi) update. Holding for manual review."
            exit 0
          fi

          # Hold codegraph (hand-written compat patch tied to a version).
          if [ "$(printf '%s' "${DEPS_JSON}" | jq '[ .[] | select(.dependencyName == "@colbymchenry/codegraph") ] | length')" -gt 0 ]; then
            echo "Contains @colbymchenry/codegraph. Holding for manual review (compat patch)."
            exit 0
          fi

          # Already requested? Leave it as is.
          if [ "$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            echo "Auto-merge already requested. Nothing to do."
            exit 0
          fi

          echo "Allowed. Requesting auto-merge (squash). GitHub merges once all required checks pass."
          gh pr merge "${PR_NUMBER}" --repo "${REPO}" --auto --squash
